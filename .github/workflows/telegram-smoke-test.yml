name: Publish Persian content to 14 channels

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/telegram-smoke-test.yml"

permissions:
  contents: read

jobs:
  publish-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish one Persian post to each channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -u
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "خطا: سکرت TELEGRAM_BOT_TOKEN تنظیم نشده است."
            exit 1
          fi

          failures=0
          send_post() {
            channel="$1"
            message="$2"
            echo "در حال ارسال به $channel"
            response="$(curl --silent --show-error --request POST \
              --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=$channel" \
              --data-urlencode "text=$message")" || response='{"ok":false,"description":"درخواست HTTP ناموفق بود"}'
            if echo "$response" | python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") else 1)'; then
              id="$(echo "$response" | python -c 'import json,sys; print(json.load(sys.stdin).get("result",{}).get("message_id","?"))')"
              echo "موفق: $channel | message_id=$id"
            else
              err="$(echo "$response" | python -c 'import json,sys; print(json.load(sys.stdin).get("description","پاسخ نامعتبر"))' 2>/dev/null || echo 'پاسخ نامعتبر')"
              echo "ناموفق: $channel | $err"
              failures=$((failures + 1))
            fi
            sleep 1
          }
          send_post "@TechNamaFa" "📱 دوربین گوشی را فقط با مگاپیکسل نسنج!\n\nعدد مگاپیکسل به‌تنهایی کیفیت عکس را تعیین نمی‌کند. اندازهٔ حسگر، کیفیت لنز، لرزش‌گیر اپتیکال و پردازش تصویر، به‌ویژه در نور کم، نقش مهمی دارند. برای مقایسهٔ دو گوشی، نمونه‌عکس‌های واقعی در شب و روز را کنار هم ببین. بهترین دوربین لزوماً دوربینی با عدد بزرگ‌تر نیست؛ دوربینی است که در شرایط استفادهٔ تو نتیجهٔ بهتری بدهد.\n\n#تک‌نما #فناوری"
          send_post "@NbzeKhabar" "📰 قبل از بازنشر خبر، این ۳ بررسی را انجام بده\n\n۱) تاریخ انتشار را ببین؛ گاهی خبر قدیمی دوباره دست‌به‌دست می‌شود.\n۲) منبع اولیه را پیدا کن؛ اسکرین‌شات بدون لینک کافی نیست.\n۳) همان ادعا را در چند رسانهٔ معتبر و مستقل جست‌وجو کن. اگر فقط یک حساب ناشناس ادعایی بزرگ را مطرح کرده، تا روشن‌شدن شواهد صبر کن. سرعت در بازنشر، جای دقت را نمی‌گیرد.\n\n#نبض_خبر #راستی‌آزمایی"
          send_post "@Khndedoon" "😹 جلسهٔ فوری با گربه!\n\nرئیس: چرا گزارش امروز آماده نیست؟\nکارمند: گربه‌ام روی لپ‌تاپ خوابیده.\nرئیس: بیدارش کن!\nکارمند: نمی‌شه؛ الان مدیر سیستم شده و رمز رو عوض کرده! 🐈‍⬛\n\nگاهی بهترین راه‌حل برای یک روز شلوغ، چند ثانیه خندیدن است.\n\n#خنده‌دون #طنز"
          send_post "@RazKehann" "🌞 ما خورشید را با کمی تأخیر می‌بینیم!\n\nنور با سرعتی نزدیک به ۳۰۰ هزار کیلومتر در ثانیه حرکت می‌کند، اما نور خورشید حدود ۸ دقیقه و ۲۰ ثانیه در راه است تا به زمین برسد. یعنی تصویری که همین حالا از خورشید می‌بینیم، مربوط به چند دقیقه قبل است. ستاره‌ها و کهکشان‌های دور را هم همان‌طور می‌بینیم که در گذشته بوده‌اند؛ تلسکوپ‌ها پنجره‌هایی به تاریخ کیهان‌اند.\n\n#راز_کیهان #نجوم"
          send_post "@FilmGardFa" "🎬 چرا بعضی صحنه‌ها بدون دیالوگ هم تأثیرگذارند؟\n\nدر سینما، جای دوربین، رنگ‌ها و نورپردازی می‌توانند احساس شخصیت را منتقل کنند. نور کم و سایه‌های تند ممکن است حس خطر بسازند؛ قاب باز و فضای خالی می‌تواند تنهایی را نشان دهد. دفعهٔ بعد که فیلم می‌بینی، پیش از شنیدن دیالوگ از خودت بپرس: این قاب چه احساسی می‌سازد؟\n\n#فیلم‌گرد #سینما"
          send_post "@MazeKhoooneh" "🥦 سبزیجات تردتر با یک نکتهٔ ساده\n\nاگر سبزیجات را در تابه بیش از حد روی هم بریزی، رطوبت جمع می‌شود و به‌جای برشته‌شدن بیشتر بخارپز می‌شوند. تابه را شلوغ نکن، مواد را خشک کن و اجازه بده سطح تابه خوب گرم شود. اگر مقدار غذا زیاد است، در دو نوبت بپز و مرتب هم نزن تا فرصت طلایی‌شدن داشته باشند.\n\n#مزه‌خونه #ترفند_آشپزی"
          send_post "@HaleKhoobDaiily" "🌿 لازم نیست همه‌چیز را همین امروز حل کنی\n\nوقتی کارها روی هم جمع می‌شوند، یک کار کوچک و مشخص انتخاب کن؛ کاری که در ۵ تا ۱۰ دقیقه تمام می‌شود. اعلان‌ها را کنار بگذار و فقط همان را انجام بده. بعد از تمام‌شدنش، دوباره تصمیم بگیر قدم بعدی چیست. پیشرفت همیشه جهش بزرگ نیست؛ گاهی یعنی آرام و پیوسته یک قدم برداشتن.\n\n#حال_خوب #عادت_سالم"
          send_post "@SafarkadehFa" "🧳 چک‌لیست کوتاه پیش از سفر\n\nقبل از حرکت، مدارک و بلیت‌ها را آفلاین هم ذخیره کن؛ ساعت کاری جاذبه‌ها و وضعیت آب‌وهوا را از منبع رسمی ببین؛ نشانی محل اقامت را ذخیره کن؛ داروهای ضروری و شارژر را فراموش نکن؛ و کمی زمان خالی برای تأخیرهای پیش‌بینی‌نشده در نظر بگیر. برنامهٔ خوب برای اتفاقات غیرمنتظره هم جا دارد.\n\n#سفرکده #سفر"
          send_post "@ZehnAgahh" "🧠 تمرین ۱۰ دقیقه‌ای برای تمرکز\n\nیک کار کوچک انتخاب کن و برای ۱۰ دقیقه اعلان‌ها را خاموش کن. هر بار متوجه شدی ذهنت به موضوع دیگری رفته، خودت را سرزنش نکن؛ فقط توجهت را به کار برگردان. هدف این نیست که هیچ‌وقت حواست پرت نشود، بلکه تمرینِ برگشتن به کار است. در پایان، یک جمله بنویس که چه چیزی پیش رفت و قدم بعدی چیست.\n\n#ذهن‌آگاه #تمرکز"
          send_post "@PoolBalad" "💰 بودجه‌بندی را با یک کار ساده شروع کن\n\nبرای یک هفته، هر هزینه را همان روز یادداشت کن و آن را در یکی از سه دسته بگذار: ضروری، تعهد ثابت یا اختیاری. بعد از هفت روز، فقط الگوها را ببین: کدام هزینه تکراری بود؟ کدام خرید از روی عجله انجام شد؟ یک تغییر کوچک و واقع‌بینانه انتخاب کن و هفتهٔ بعد نتیجه را بسنج. این مطلب آموزشی است و توصیهٔ سرمایه‌گذاری نیست.\n\n#پول‌بلد #بودجه‌بندی"
          send_post "@LevelUpFa" "🚀 روش ساده برای یادگیری ماندگارتر\n\nبعد از خواندن یک بخش، کتاب یا صفحه را ببند و سه نکتهٔ اصلی را از حافظه بنویس. سپس برگرد و بررسی کن چه چیزی جا افتاده است. این روش کمک می‌کند به‌جای آشنایی ظاهری با متن، توانایی یادآوری را تمرین کنی. مرور کوتاه در روزهای بعد هم می‌تواند مفید باشد. مهم این است که با فاصله و به‌صورت فعال تمرین کنی.\n\n#لِوِل‌آپ #یادگیری"
          send_post "@NimeShabHorror" "🌑 صدای پشت در\n\nساعت ۲:۱۳ بود که سه ضربه به در خورد. خانه ساکت بود؛ همه می‌دانستند من تنها زندگی می‌کنم. به سمت چشمی در رفتم، اما راهرو خالی بود. گوشی‌ام لرزید؛ پیامی از شمارهٔ خودم آمده بود: «هر اتفاقی افتاد، در را باز نکن.»\n\nضربه‌ها دوباره تکرار شدند؛ این بار از داخل کمد پشت سرم.\n\nاین داستان کوتاه تخیلی است.\n\n#نیمه‌شب #داستان_ترسناک"
          send_post "@TradePulseFa" "📉 پیش از ورود به معامله، ریسک را حساب کن\n\nقبل از بازکردن هر موقعیت، سه چیز را مشخص کن: نقطهٔ ورود، سطحی که در آن ایدهٔ معامله دیگر معتبر نیست، و حداکثر زیانی که می‌پذیری. اندازهٔ موقعیت را بر اساس فاصلهٔ ورود تا حد ضرر و بودجهٔ ریسک تعیین کن، نه بر اساس هیجان یا ترس از جا ماندن. مدیریت ریسک ضرر را حذف نمی‌کند؛ هدفش محدودکردن اثر یک تصمیم اشتباه است. این مطلب آموزشی است، نه سیگنال معاملاتی.\n\n#تریدپالس #مدیریت_ریسک"
          send_post "@NetPlusFa" "🔐 سه قدم ساده برای امن‌ترکردن حساب‌ها\n\n۱) برای هر حساب مهم رمز متفاوت و طولانی استفاده کن؛ مدیر رمز می‌تواند کمک کند.\n۲) احراز هویت دومرحله‌ای را فعال کن و در صورت امکان از برنامهٔ تأیید هویت یا کلید امنیتی استفاده کن.\n۳) کد یک‌بارمصرف و لینک بازیابی را با هیچ‌کس به اشتراک نگذار؛ پشتیبانی واقعی هم نباید رمزت را بخواهد. نشست‌های فعال را بررسی کن و دسترسی دستگاه‌های ناشناس را لغو کن.\n\n#نت‌پلاس #امنیت_سایبری"

          echo "نتیجه: 14 کانال پردازش شد؛ ${failures} مورد ناموفق."
          [ "$failures" -eq 0 ]

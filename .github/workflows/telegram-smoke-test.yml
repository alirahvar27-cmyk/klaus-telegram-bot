name: Telegram 14-channel Persian smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send one Persian test message to each configured channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -u
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "خطا: سکرت TELEGRAM_BOT_TOKEN تنظیم نشده است."
            exit 1
          fi

          channels=(
            "@TechNamaFa"
            "@NbzeKhabar"
            "@Khndedoon"
            "@RazKehann"
            "@FilmGardFa"
            "@MazeKhoooneh"
            "@HaleKhoobDaiily"
            "@SafarkadehFa"
            "@ZehnAgahh"
            "@PoolBalad"
            "@LevelUpFa"
            "@NimeShabHorror"
            "@TradePulseFa"
            "@NetPlusFa"
          )

          failures=0
          for channel in "${channels[@]}"; do
            echo "در حال آزمایش: $channel"
            response="$(curl --silent --show-error --request POST \
              --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=$channel" \
              --data-urlencode "text=تست فنی کلاوس: ارسال پیام به این کانال بررسی شد. این فقط یک پیام آزمایشی است.")" || response='{"ok":false,"description":"درخواست HTTP ناموفق بود"}'

            if echo "$response" | python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") else 1)'; then
              message_id="$(echo "$response" | python -c 'import json,sys; print(json.load(sys.stdin).get("result",{}).get("message_id","?"))')"
              echo "موفق: $channel | message_id=$message_id"
            else
              description="$(echo "$response" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("description","پاسخ نامعتبر تلگرام"))' 2>/dev/null || echo 'پاسخ نامعتبر تلگرام')"
              echo "ناموفق: $channel | $description"
              failures=$((failures + 1))
            fi
            sleep 1
          done

          echo "نتیجه: ${#channels[@]} کانال بررسی شد؛ ${failures} مورد ناموفق."
          [ "$failures" -eq 0 ]

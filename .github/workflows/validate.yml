name: KLAUS Code Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q main.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check source parsing library
        run: python -c "import feedparser; print('feedparser import OK')"

name: KLAUS Approval Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: klaus-approval-bot
  cancel-in-progress: false

jobs:
  approval-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install requests

      - name: Initialize state
        run: |
          if [ ! -f telegram_approval_state.json ]; then
            printf '{"offset":0,"pending":{},"edit_mode":{}}\n' > telegram_approval_state.json
          fi

      - name: Validate bot
        run: python -m py_compile telegram_approval_bot.py

      - name: Poll bot updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          POLL_SECONDS: "210"
          PYTHONUNBUFFERED: "1"
        run: python telegram_approval_bot.py

      - name: Save pending drafts and update offset
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_approval_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Save KLAUS approval bot state"
            git push
          else
            echo "No approval bot state changes."
          fi

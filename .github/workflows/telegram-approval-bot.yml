name: کلاوس بیدار شو

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/telegram-approval-bot.yml"
      - "telegram_approval_bot.py"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: klaus-approval-bot
  cancel-in-progress: true

jobs:
  approval-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply chat cleanup patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('telegram_approval_bot.py')
          s = p.read_text(encoding='utf-8')
          marker = '# CHAT_CLEANUP_V1'
          if marker in s:
              print('Chat cleanup already applied')
              raise SystemExit(0)
          anchor = '''def preview(chat_id, draft_id):
    draft = STATE["pending"].get(draft_id)
    if not draft:
        return
'''
          replacement = anchor + '''    if draft.get("preview_message_ids"):
        cleanup_draft_messages(draft)
        draft["cleanup_message_ids"] = []
        draft["preview_message_ids"] = []

    # CHAT_CLEANUP_V1
'''
          if anchor not in s:
              raise SystemExit('preview anchor not found')
          s = s.replace(anchor, replacement, 1)
          old = '        send_text(chat_id, "کانال مقصد جدید را انتخاب کن:", rows)'
          new = '''        selection_msg = send_text(chat_id, "کانال مقصد جدید را انتخاب کن:", rows)
        draft.setdefault("cleanup_message_ids", []).append(selection_msg["message_id"])
        save_state()'''
          if old not in s:
              raise SystemExit('channel selection message not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile telegram_approval_bot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_approval_bot.py
          if ! git diff --cached --quiet; then
            git commit -m "Clean approval chat after draft changes"
            git push
          else
            echo "No approval bot code changes."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install requests

      - name: Initialize state
        run: |
          if [ ! -f telegram_approval_state.json ]; then
            printf '{"offset":0,"pending":{},"edit_mode":{}}\n' > telegram_approval_state.json
          fi

      - name: Validate bot
        run: python -m py_compile telegram_approval_bot.py

      - name: Poll bot updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          POLL_SECONDS: "540"
          PYTHONUNBUFFERED: "1"
        run: python telegram_approval_bot.py

      - name: Save pending drafts and update offset
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_approval_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Save KLAUS approval bot state"
            git pull --rebase origin main
            git push
          else
            echo "No approval bot state changes."
          fi

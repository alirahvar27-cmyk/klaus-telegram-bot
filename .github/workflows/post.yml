
name: KLAUS Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: klaus-publisher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Initialize posting state
        run: |
          if [ ! -f sent.json ]; then
            echo "[]" > sent.json
          fi

      - name: Run KLAUS
        env:
          DRY_RUN: "false"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL }}
          # Try OpenAI last; if it fails, the Python publisher logs the error and continues to the next scheduled run.
          KLAUS_AI_ORDER: "gemini,groq,openrouter,openai"
          KLAUS_SOURCE_FEEDS: ${{ vars.KLAUS_SOURCE_FEEDS }}
          KLAUS_VIDEO_DOWNLOAD_ENABLED: "true"
          KLAUS_VIDEO_MAX_BYTES: "50000000"
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Save duplicate-prevention state
        if: always()
        run: |
          if [ ! -f sent.json ]; then
            echo "[]" > sent.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sent.json
          if [ -f content_rotation.json ]; then git add content_rotation.json; fi

          if ! git diff --cached --quiet; then
            git commit -m "Update KLAUS posting state"
            git push
          else
            echo "No state changes to save."
          fi
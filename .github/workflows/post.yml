
name: KLAUS Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: klaus-publisher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Initialize posting state
        run: |
          if [ ! -f sent.json ]; then
            echo "[]" > sent.json
          fi

      - name: Run KLAUS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          KLAUS_AI_ORDER: ${{ vars.KLAUS_AI_ORDER }}
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Save duplicate-prevention state
        if: always()
        run: |
          if [ ! -f sent.json ]; then
            echo "[]" > sent.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sent.json

          if ! git diff --cached --quiet; then
            git commit -m "Update KLAUS posting state"
            git push
          else
            echo "No state changes to save."
          fi
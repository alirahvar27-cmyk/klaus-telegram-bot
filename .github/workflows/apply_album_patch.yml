name: Apply media-group fix

on:
  push:
    paths:
      - '.github/workflows/apply_album_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch approval bot
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('telegram_approval_bot.py')
          s = p.read_text(encoding='utf-8')
          marker = '# CHAT_CLEANUP_V1'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)

          anchor = '''def preview(chat_id, draft_id):
    draft = STATE["pending"].get(draft_id)
    if not draft:
        return
'''
          replacement = anchor + '''    if draft.get("preview_message_ids"):
        cleanup_draft_messages(draft)
        draft["cleanup_message_ids"] = []
        draft["preview_message_ids"] = []

    # CHAT_CLEANUP_V1
'''
          if anchor not in s:
              raise SystemExit('preview anchor not found')
          s = s.replace(anchor, replacement, 1)

          old = '        send_text(chat_id, "کانال مقصد جدید را انتخاب کن:", rows)'
          new = '''        selection_msg = send_text(chat_id, "کانال مقصد جدید را انتخاب کن:", rows)
        draft.setdefault("cleanup_message_ids", []).append(selection_msg["message_id"])
        save_state()'''
          if old not in s:
              raise SystemExit('channel selection message not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile telegram_approval_bot.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram_approval_bot.py
          git commit -m 'Clean approval chat after draft changes'
          git push

name: Validate scheduler patch

on:
  push:
    branches:
      - fix/approval-scheduler-queue

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile approval bot
        run: python -m py_compile telegram_approval_bot.py

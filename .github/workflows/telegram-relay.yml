name: Telegram Source Relay

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: klaus-telegram-source-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Initialize relay state
        run: |
          if [ ! -f telegram_relay_state.json ]; then
            echo "{}" > telegram_relay_state.json
          fi

      - name: Validate relay scripts
        run: python -m py_compile telegram_relay.py generate_telegram_session.py

      - name: Poll authorized Telegram sources
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          RELAY_SOURCE_TARGETS: ${{ vars.RELAY_SOURCE_TARGETS }}
          RELAY_MAX_MEDIA_BYTES: "50000000"
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ] && [ -n "$TELEGRAM_SESSION_STRING" ]; then
            python telegram_relay.py
          else
            echo "Relay is not enabled yet. Add TELEGRAM_API_ID, TELEGRAM_API_HASH, and TELEGRAM_SESSION_STRING in repository Actions secrets."
          fi

      - name: Save relay cursors
        if: always()
        run: |
          if [ ! -f telegram_relay_state.json ]; then
            echo "{}" > telegram_relay_state.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_relay_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram relay cursors"
            git push
          else
            echo "No relay cursor changes."
          fi

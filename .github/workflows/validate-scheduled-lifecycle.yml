name: Validate scheduled lifecycle patch
on:
  push:
    branches:
      - fix/scheduled-publish-lifecycle
    paths:
      - "telegram_approval_bot.py"
      - ".github/workflows/telegram-approval-bot.yml"
      - ".github/workflows/validate-scheduled-lifecycle.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scheduled-publish-lifecycle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bot
        run: python -m py_compile telegram_approval_bot.py
      - name: Parse workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/telegram-approval-bot.yml"); puts "workflow YAML parsed"'
      - name: Check lifecycle safeguards
        run: |
          grep -q 'publish_due_drafts()' telegram_approval_bot.py
          grep -q 'ref: main' .github/workflows/telegram-approval-bot.yml
          grep -q 'POLL_SECONDS: "570"' .github/workflows/telegram-approval-bot.yml
          grep -q 'timeout-minutes: 15' .github/workflows/telegram-approval-bot.yml
